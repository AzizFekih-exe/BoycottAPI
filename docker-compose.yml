version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: boycott_user
      POSTGRES_PASSWORD: strong_password
      POSTGRES_DB: boycott
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    image: boycott-api
    depends_on:
      - db
    env_file:
      - .env.prod
    ports:
      - "5000:5000"

volumes:
  postgres_data:
